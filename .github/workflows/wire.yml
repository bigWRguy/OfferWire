name: scheduled

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch:
    inputs:
      profiles_per_run:
        description: 'Profile timelines to poll (0 = off; those widgets are usually frozen)'
        required: false
        default: '0'

concurrency:
  group: scheduled
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: check
        run: |
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("data/state.json", "utf8"));
            const at = Date.parse(s.searchCoverage?.at || 0);
            const age = Date.now() - at;
            const shouldRun = !Number.isFinite(at) || age >= 10 * 60 * 1000;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_run=" + shouldRun + "\n");
            console.log(shouldRun ? "collector due" : "skip duplicate: last collection " + Math.round(age / 1000) + "s ago");
          '

  wire:
    needs: freshness
    if: needs.freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: install browser
        run: npx playwright install --with-deps chromium

      - name: route the browser through WARP
        run: bash scripts/warp-up.sh

      - name: self test
        run: |
          node scripts/selftest.mjs
          node scripts/fixture-run.mjs

      - name: run wire
        continue-on-error: true
        id: wire
        env:
          X_SESSIONS: ${{ secrets.X_SESSIONS }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          OFFERWIRE_MODE: live
          OFFERWIRE_BACKFILL_DAYS: 0
          OFFERWIRE_REQUESTS_PER_CRED: ${{ vars.OFFERWIRE_REQUESTS_PER_CRED || '26' }}
          OFFERWIRE_SCROLLS: ${{ vars.OFFERWIRE_SCROLLS || '0' }}
          OFFERWIRE_PROFILES_PER_RUN: ${{ inputs.profiles_per_run || vars.OFFERWIRE_PROFILES_PER_RUN || '0' }}
        run: node src/pipeline.js

      - name: build static site
        run: node scripts/build-status.mjs && node scripts/build-site.mjs

      - name: commit ledger
        run: |
          git config user.name  "automation"
          git config user.email "automation@users.noreply.github.com"
          git add data/ site/wire.json site/status.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "wire: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: deploy directly to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Netlify deploy is not configured. Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID, or link the repository in Netlify."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir site --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

      - name: verify coverage
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("data/site/status.json","utf8"));
            let bad = 0;
            const fail = (m) => { console.error("FAIL: " + m); bad = 1; };
            const warn = (m) => console.warn("coverage: " + m);
            const say = (m) => console.log("coverage: " + m);
            if (!s.searchConfigured) fail("search is not working - this wire is blind to anyone you do not already follow.");
            const warm = s.warmedUp !== false;
            const sc = s.searchCoverage || {};
            const bc = s.backfillCoverage || {};
            const reqs = (sc.requests || 0) + (bc.requests || 0);
            const swept = (sc.sweptThisRun || 0) + (bc.sweptThisRun || 0);
            if (s.searchConfigured && warm && reqs > 0 && swept === 0) fail("search returned 0 sweeps this run - session is dead or fully rate-limited.");
            if ((s.quality?.incompleteOffers || 0) > 0) fail(s.quality.incompleteOffers + " incomplete offers reached publication.");
            if (!warm) { say("warming up: latency not yet meaningful on a cold ledger"); }
            else {
              const bf = s.backfill && s.backfill.totalWindows > 0 ? s.backfill : null;
              const bfActive = !!(bf && (bf.remainingWindows || 0) > 0);
              const bfJustDone = !!(bf && !bfActive && bf.at && (Date.now() - new Date(bf.at).getTime()) < 6 * 3600e3);
              const planLiveShare = bfActive || bfJustDone ? 0.2 : 1;
              const liveCycles = sc.fullSweepCycles || Math.ceil((sc.jobsTotal || 1) / Math.max(1, sc.sweptThisRun || 1));
              const expectedH = (liveCycles * 15) / 60;
              let toleranceH = Math.max(6 / Math.max(0.1, planLiveShare), expectedH * 2.5);
              toleranceH = Math.min(toleranceH, 24);
              const stale = (s.staleSchools || []).filter((x) => x.hours === null || x.hours > 2);
              const modeLabel = bfActive ? "backfill bootstrap" : (bfJustDone ? "backfill drain grace" : "live");
              const hardCeiling = Math.max(Number(process.env.OFFERWIRE_STALE_CEILING_H || 12), toleranceH);
              const stuck = (s.staleSchools || []).filter((x) => x.hours === null || x.hours > hardCeiling);
              const sinceBlockH = s.lastBlockedAt ? (Date.now() - new Date(s.lastBlockedAt).getTime()) / 36e5 : Infinity;
              const draining = sinceBlockH < Math.max(3, expectedH * 2);
              if (s.searchBlocked) say(stuck.length + " schools stale >" + hardCeiling + "h, but search is blocked by X - the block is the fault, not coverage (" + (s.blockedRuns || 0) + " run(s) in a row).");
              else if (draining && stuck.length > 20) say(stuck.length + " schools stale >" + hardCeiling + "h, draining the backlog from a block that lifted " + sinceBlockH.toFixed(1) + "h ago - one live pass is ~" + expectedH.toFixed(1) + "h.");
              else if (stuck.length > 20) fail(stuck.length + " schools stale >" + hardCeiling + "h - coverage is failing, not just slow. Run scripts/coverage.mjs.");
              else if (stale.length > 20) warn(stale.length + " schools stale >" + toleranceH.toFixed(1) + "h (" + modeLabel + ", planned live share " + (planLiveShare * 100).toFixed(0) + "%). Busy programs flood faster than one page per sweep drains - raise OFFERWIRE_SCROLLS or add sessions to cut latency; nothing is lost either way.");
              else if (stale.length) say(stale.length + " schools stale >" + toleranceH.toFixed(1) + "h but within the " + modeLabel + " envelope.");
              else say("all schools are within " + toleranceH.toFixed(1) + "h of their watermark");
            }
            if (s.searchCoverage) say("swept " + sc.sweptThisRun + "/" + sc.jobsTotal + " live jobs; live pass ~" + sc.fullSweepCycles + " cycles; tolerance " + (Math.min(Math.max(6 / Math.max(0.1, (s.backfill && s.backfill.totalWindows > 0 ? 0.2 : 1)), (sc.fullSweepCycles || 1) * 15 / 60 * 2.5), 24)).toFixed(1) + "h");
            const dead = Object.entries(s.health || {}).filter(([k,v]) => k.startsWith("list:") && v.error);
            if (dead.length) warn("dead lists: " + dead.map(([k,v]) => k+" "+v.error).join("; "));
            process.exit(bad);
          '
