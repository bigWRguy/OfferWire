name: probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Which diagnostic to run'
        required: true
        default: block
        type: choice
        options: [block, netlify, warp]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: install browser
        if: inputs.probe != 'netlify'
        run: npx playwright install --with-deps chromium

      - name: raise a WARP tunnel
        if: inputs.probe == 'warp'
        run: bash scripts/warp-up.sh

      - name: is the block the address or the account?
        if: inputs.probe != 'netlify'
        env:
          X_SESSIONS: ${{ secrets.X_SESSIONS }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: node scripts/probe-block.mjs

      - name: where are the build minutes going?
        if: inputs.probe == 'netlify'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/netlify-usage.mjs
