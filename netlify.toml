[build]
  publish = "site"
  command = "node scripts/build-status.mjs && node scripts/build-site.mjs"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
