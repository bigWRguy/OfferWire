# Netlify serves the static site plus the JSON the wire commits. There is no build step
# and no server: GitHub Actions produces data/site/*.json, Netlify publishes it. A push
# from the wire is what triggers a redeploy, so the site is never more than one run
# behind the ledger.
[build]
  publish = "site"
  command = "node scripts/build-status.mjs && node scripts/build-site.mjs"
  # NEVER build on Netlify. The wire commits a ledger to main every quarter hour, and the
  # project is git-linked, so each of those pushes was starting a build on Netlify's
  # infrastructure — ~54 of them in the first five days of September 2026, and the only
  # thing on the account spending build minutes. They produced nothing: the workflow
  # already builds the site on the GitHub runner and ships it prebuilt with the CLI, which
  # costs no minutes at all. `ignore` returning 0 means "nothing to do here", so the git
  # build is skipped before it starts. Deploys still happen — they just come from Actions.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

# The wire data changes on quarter-hour runs; never let a CDN pin it.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
